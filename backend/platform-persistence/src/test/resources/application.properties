# Integration-test configuration. The datasource URL/credentials are supplied at runtime by
# AbstractPostgresIntegrationTest via @DynamicPropertySource (Testcontainers).
#
# Flyway owns the schema, so Hibernate must never touch DDL. Note that spring.flyway.schemas is
# deliberately NOT set here: leaving it out exercises the FlywayConfigurationCustomizer shipped
# by PersistenceAutoConfiguration, which is what real services rely on.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true

spring.main.banner-mode=off
logging.level.org.flywaydb=info
logging.level.org.testcontainers=info
logging.level.com.github.dockerjava=warn
