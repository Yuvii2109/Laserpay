# PDEI - Loki 3.x, single-binary filesystem mode.
#
# Sized for a laptop: no object storage, no ring beyond an inmemory kvstore, no compactor
# schedule worth tuning. It exists to make "show me every log line for correlationId X
# across seven services" a five-second operation.
#
# Two ingest paths land here:
#   promtail  -> /loki/api/v1/push   (container stdout, JSON-parsed, labelled)
#   collector -> /otlp/v1/logs       (OTLP logs forwarded by otel-collector)

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  # Case X-Ray log pulls can be chunky.
  grpc_server_max_recv_msg_size: 8388608
  grpc_server_max_send_msg_size: 8388608

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  metric_aggregation_enabled: true
  reject_old_samples: false          # the simulator deliberately emits late events
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 32              # a full simulator run is bursty
  ingestion_burst_size_mb: 64
  max_streams_per_user: 10000
  max_label_names_per_series: 30
  max_query_series: 5000
  max_query_lookback: 168h
  volume_enabled: true
  allow_structured_metadata: true
  # OTLP resource attributes we want as real stream labels rather than metadata.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment
            - pdei.merchant_id

pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 1h

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h            # 7 days is plenty for a demo/benchmark loop

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: true

analytics:
  reporting_enabled: false
