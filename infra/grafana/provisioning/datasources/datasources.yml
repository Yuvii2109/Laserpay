# PDEI - Grafana datasource provisioning.
#
# UIDs are pinned (pdei-prometheus / pdei-loki / pdei-tempo) because the dashboard JSON in
# infra/grafana/dashboards references them by uid. Renaming a uid here silently breaks
# every panel; add a new datasource instead.
#
# The three are cross-linked so a single click walks the whole story:
#   Tempo span  -> Loki logs for that traceId   (tracesToLogsV2)
#   Loki line   -> Tempo trace for that traceId (derivedFields)
#   Tempo span  -> Prometheus span metrics      (tracesToMetrics)

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:

  - name: Prometheus
    uid: pdei-prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.54.1
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: pdei-tempo

  - name: Loki
    uid: pdei-loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    editable: true
    jsonData:
      timeout: 60
      maxLines: 2000
      # Turn a traceId in a log line into a Tempo link.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: traceId
          url: "${__value.raw}"
          datasourceUid: pdei-tempo
        - name: TraceIDFromText
          matcherType: regex
          matcherRegex: '"traceId"\s*:\s*"([a-f0-9]+)"'
          url: "${__value.raw}"
          datasourceUid: pdei-tempo

  - name: Tempo
    uid: pdei-tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      streamingEnabled:
        search: true
      # Span -> logs. Matches on the trace id and narrows to the same service.
      tracesToLogsV2:
        datasourceUid: pdei-loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      # Span -> RED metrics generated by Tempo's metrics_generator.
      tracesToMetrics:
        datasourceUid: pdei-prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: service
        queries:
          - name: "Request rate"
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: "Error rate"
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags,status_code="STATUS_CODE_ERROR"}[5m]))'
      serviceMap:
        datasourceUid: pdei-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: pdei-loki
